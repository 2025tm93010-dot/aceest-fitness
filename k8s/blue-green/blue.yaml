apiVersion: apps/v1
kind: Deployment
metadata: {name: aceest-blue}
spec:
  replicas: 2
  selector: {matchLabels: {app: aceest-fitness, color: blue}}
  template:
    metadata: {labels: {app: aceest-fitness, color: blue}}
    spec:
      containers:
      - name: app
        image: DOCKERHUB_USERNAME/aceest-fitness:stable
        ports: [{containerPort: 5000}]
        readinessProbe: {httpGet: {path: /health, port: 5000}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: aceest-green}
spec:
  replicas: 2
  selector: {matchLabels: {app: aceest-fitness, color: green}}
  template:
    metadata: {labels: {app: aceest-fitness, color: green}}
    spec:
      containers:
      - name: app
        image: DOCKERHUB_USERNAME/aceest-fitness:green
        ports: [{containerPort: 5000}]
        readinessProbe: {httpGet: {path: /health, port: 5000}}
---
apiVersion: v1
kind: Service
metadata: {name: aceest-live}
spec:
  type: NodePort
  selector: {app: aceest-fitness, color: blue}
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30081

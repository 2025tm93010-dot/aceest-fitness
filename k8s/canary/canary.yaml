apiVersion: apps/v1
kind: Deployment
metadata: {name: aceest-canary}
spec:
  replicas: 1
  selector: {matchLabels: {app: aceest-fitness, track: canary}}
  template:
    metadata: {labels: {app: aceest-fitness, track: canary}}
    spec:
      containers:
      - name: app
        image: DOCKERHUB_USERNAME/aceest-fitness:canary
        ports: [{containerPort: 5000}]
        readinessProbe: {httpGet: {path: /health, port: 5000}}
---
apiVersion: v1
kind: Service
metadata: {name: aceest-canary}
spec:
  selector: {app: aceest-fitness, track: canary}
  ports:
  - port: 5000
    targetPort: 5000

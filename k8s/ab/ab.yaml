apiVersion: apps/v1
kind: Deployment
metadata: {name: aceest-a}
spec:
  replicas: 2
  selector: {matchLabels: {app: aceest-a}}
  template:
    metadata: {labels: {app: aceest-a}}
    spec:
      containers:
      - name: app
        image: DOCKERHUB_USERNAME/aceest-fitness:a
        ports: [{containerPort: 5000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: aceest-b}
spec:
  replicas: 2
  selector: {matchLabels: {app: aceest-b}}
  template:
    metadata: {labels: {app: aceest-b}}
    spec:
      containers:
      - name: app
        image: DOCKERHUB_USERNAME/aceest-fitness:b
        ports: [{containerPort: 5000}]
---
apiVersion: v1
kind: Service
metadata: {name: aceest-a}
spec:
  selector: {app: aceest-a}
  ports: [{port: 5000, targetPort: 5000}]
---
apiVersion: v1
kind: Service
metadata: {name: aceest-b}
spec:
  selector: {app: aceest-b}
  ports: [{port: 5000, targetPort: 5000}]
